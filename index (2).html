<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Personal Growth Notes</title>






<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #0d1117;
  color: #f0f0f0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
  font-size: 18px;
}
.container {
  width: 100%;
  max-width: 700px;
  background: linear-gradient(145deg, #1c1c1c, #242424);
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  padding: 40px;
  margin-top: 50px;
}
h2 {
  text-align: center;
  margin-bottom: 30px;
  font-weight: 700;
  font-size: 2em;
  color: #e0e0e0;
}
input, textarea, button, select {
  width: 100%;
  margin: 10px 0;
  padding: 14px;
  border-radius: 16px;
  border: none;
  font-size: 1.1em;
  outline: none;
  transition: 0.2s;
}
input, textarea, select {
  background: #2b2b2b;
  color: #f0f0f0;
}
input:focus, textarea:focus, select:focus {
  box-shadow: 0 0 8px #4caf50;
}
button {
  background: #4caf50;
  color: #fff;
  cursor: pointer;
  font-weight: 700;
  transition: 0.3s;
  padding: 14px;
}
button:hover {
  background: #66bb6a;
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.6);
}
.category, .note {
  background: #2b2b2b;
  padding: 16px;
  margin-top: 16px;
  border-radius: 16px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.5);
  transition: 0.2s;
  font-size: 1.1em;
}
.category:hover, .note:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px rgba(0,0,0,0.6);
}
.note { 
  margin-left: 14px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
}
.note span { flex: 1; padding-right: 12px; word-wrap: break-word; }
.note button { 
  background: #f44336; 
  margin-left: 8px; 
  padding: 6px 10px; 
  font-size: 1em; 
  border-radius: 10px;
  transition: 0.2s;
}
.note button:hover { 
  background: #e57373;
  transform: translateY(-1px);
}
.category-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.add-note-btn {
  background: #2196F3;
  color: #fff;
  font-weight: 700;
  padding: 10px 16px;
  border-radius: 14px;
  transition: 0.3s;
  font-size: 1em;
}
.add-note-btn:hover {
  background: #42a5f5;
  transform: translateY(-2px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.5);
}
.hidden { display: none; }
</style>



</head>
<body>

<div class="container" id="authBox">
  <h2>Login / Sign Up</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<div class="container hidden" id="notesBox">
  <h2>My Notes</h2>
  <input id="newCategory" placeholder="New category name">
  <button onclick="addCategory()">Add Category</button>
  <div id="categories"></div>
  <button onclick="logout()">Logout</button>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users") || "{}");
let currentUser = localStorage.getItem("currentUser");

const authBox = document.getElementById("authBox");
const notesBox = document.getElementById("notesBox");

if(currentUser) showNotes();

function saveUsers() {
  localStorage.setItem("users", JSON.stringify(users));
}

function signup() {
  const u = username.value.trim();
  const p = password.value;
  if(!u || !p) return alert("Fill all fields");
  if(users[u]) return alert("User exists");
  users[u] = { password: p, categories: {} };
  saveUsers();
  alert("Account created");
}

function login() {
  const u = username.value.trim();
  const p = password.value;
  if(!users[u] || users[u].password !== p) return alert("Wrong login");
  currentUser = u;
  localStorage.setItem("currentUser", u);
  showNotes();
}

function logout() {
  localStorage.removeItem("currentUser");
  location.reload();
}

function showNotes() {
  authBox.classList.add("hidden");
  notesBox.classList.remove("hidden");
  render();
}

function addCategory() {
  const name = newCategory.value.trim();
  if(!name) return alert("Enter category name");
  if(users[currentUser].categories[name]) return alert("Category exists");
  users[currentUser].categories[name] = [];
  newCategory.value = "";
  saveUsers();
  render();
}

function addNote(cat) {
  const text = prompt("Write your note:");
  if(!text) return;
  users[currentUser].categories[cat].push({ content: text });
  saveUsers();
  render();
}

function editNote(cat, index) {
  const newText = prompt("Edit note:", users[currentUser].categories[cat][index].content);
  if(!newText) return;
  users[currentUser].categories[cat][index].content = newText;
  saveUsers();
  render();
}

function deleteNote(cat, index) {
  if(!confirm("Delete this note?")) return;
  users[currentUser].categories[cat].splice(index, 1);
  saveUsers();
  render();
}

function render() {
  const container = document.getElementById("categories");
  container.innerHTML = "";
  const cats = users[currentUser].categories;
  for(const cat in cats) {
    const div = document.createElement("div");
    div.className = "category";
    const header = document.createElement("div");
    header.className = "category-header";
    header.innerHTML = `<strong>${cat}</strong>`;
    const addBtn = document.createElement("button");
    addBtn.textContent = "+ Add Note";
    addBtn.className = "add-note-btn";
    addBtn.onclick = () => addNote(cat);
    header.appendChild(addBtn);
    div.appendChild(header);

    cats[cat].forEach((n, i) => {
      const noteDiv = document.createElement("div");
      noteDiv.className = "note";
      noteDiv.innerHTML = `<span>${n.content}</span>`;
      const btns = document.createElement("div");
      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.onclick = () => editNote(cat, i);
      const delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.onclick = () => deleteNote(cat, i);
      btns.appendChild(editBtn);
      btns.appendChild(delBtn);
      noteDiv.appendChild(btns);
      div.appendChild(noteDiv);
    });

    container.appendChild(div);
  }
}
</script>

</body>
</html>

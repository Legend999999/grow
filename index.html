<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Growth Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="authBox">
  <h2>Login / Sign Up</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signup()">دروستکردنی ئەکاونتی نوێ</button>
  <button onclick="login()">چوونەژورەوە</button>
</div>

<div class="container hidden" id="notesBox">
  <h2>زانیاریەکانم</h2>
  <input id="newCategory" placeholder="ناوی خشتە">
  <button onclick="addCategory()">زیادکردنی خشتە</button>
  <div id="categories"></div>
  <hr>
  <!-- Backup Buttons -->
<div class="container" id="backupBox">
<h2 class="backup-title">گەڕاندنەوەی داتاکان</h2>
  <button class="backup-btn" onclick="exportBackup()">Backup</button>
  <input type="file" class="backup-btn" id="importFile" onchange="importBackup(event)">
</div>

  <button class="logout" onclick="logout()">Logout</button>
</div>

<script src="app.js"></script>
</body>
</html>
